name: deploy-site

# Both docs hosts serve TARGET_DIR/index and retain the previous site in index.bak.
# Promotion requires Python 3 and Linux renameat2(RENAME_EXCHANGE) on that filesystem.
on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    if: >
      github.repository == 'antdv-next/antdv-next-mobile' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == 'main')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build and package site
        run: |
          pnpm build:site
          mkdir site-release
          tar -czf site-release/site.tar.gz -C docs/dist .
          cp scripts/deploy_docs.py site-release/
          cd site-release
          sha256sum site.tar.gz > site.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: site-release
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: global
            suffix: ''
          - region: cn
            suffix: _CN
    concurrency:
      group: deploy-site-${{ matrix.region }}
      cancel-in-progress: false
    env:
      TARGET_DIR: ${{ secrets[format('DEPLOY_TARGET_PATH{0}', matrix.suffix)] }}
      RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site-dist

      - name: Stage the verified revision
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets[format('DEPLOY_HOST{0}', matrix.suffix)] }}
          username: ${{ secrets[format('DEPLOY_USERNAME{0}', matrix.suffix)] }}
          password: ${{ secrets[format('DEPLOY_PASSWORD{0}', matrix.suffix)] }}
          port: ${{ secrets[format('DEPLOY_PORT{0}', matrix.suffix)] }}
          source: site.tar.gz,site.sha256,deploy_docs.py
          target: ${{ env.TARGET_DIR }}/.deploy/${{ env.RELEASE_ID }}

      - name: Verify and activate staged site
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets[format('DEPLOY_HOST{0}', matrix.suffix)] }}
          username: ${{ secrets[format('DEPLOY_USERNAME{0}', matrix.suffix)] }}
          password: ${{ secrets[format('DEPLOY_PASSWORD{0}', matrix.suffix)] }}
          port: ${{ secrets[format('DEPLOY_PORT{0}', matrix.suffix)] }}
          envs: TARGET_DIR,RELEASE_ID
          script: |
            set -eu
            cd "${TARGET_DIR:?}"
            target=$(pwd -P)
            stage="$target/.deploy/${RELEASE_ID:?}"
            cd "$stage"
            sha256sum --check site.sha256
            mkdir site
            tar -xzf site.tar.gz -C site
            python3 -B deploy_docs.py site "$target"
            cd "$target"
            rm -r -- "$stage"
