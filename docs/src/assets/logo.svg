<svg xmlns="http://www.w3.org/2000/svg" width="80" height="56" viewBox="10 22 80 56" fill="none">
  <defs>
    <linearGradient id="am-leg-l" x1="21" y1="63" x2="38" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A5CFF"/>
      <stop offset=".55" stop-color="#0E9BFF"/>
      <stop offset="1" stop-color="#26D6FF"/>
    </linearGradient>
    <linearGradient id="am-fold-l" x1="34" y1="36" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A6EEB"/>
      <stop offset=".5" stop-color="#1281FA"/>
      <stop offset="1" stop-color="#2BA9FF"/>
    </linearGradient>
    <linearGradient id="am-fold-r" x1="52" y1="52" x2="72" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16B2FF"/>
      <stop offset="1" stop-color="#2CE6FF"/>
    </linearGradient>
    <linearGradient id="am-leg-r" x1="67" y1="34" x2="80" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1C8FF2"/>
      <stop offset=".5" stop-color="#19BDFF"/>
      <stop offset="1" stop-color="#1BE2FF"/>
    </linearGradient>
    <linearGradient id="am-heart" x1="50" y1="60" x2="50" y2="71" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5F57"/>
      <stop offset="1" stop-color="#F8404B"/>
    </linearGradient>
  </defs>
  <!-- each band wraps the outer round of the next corner; the following band starts with a curved edge on top of it -->
  <!-- left leg, wrapping over the left peak -->
  <g fill="url(#am-leg-l)">
    <circle cx="21.4" cy="62.6" r="5.4"/>
    <path d="M26.42 64.59 L34.97 43.07 L42.84 51.04 L50.52 43.45 L39.64 32.43 A8 8 0 0 0 26.51 35.1 L16.38 60.61 Z"/>
  </g>
  <!-- left fold: left peak down to the valley, wrapping under it -->
  <path d="M34.97 43.07 C37 37.96 39.02 35.07 42.96 35.79 L50 42.92 L57.52 35.31 L65.2 42.9 L55.69 52.53 A8 8 0 0 1 44.31 52.53 Z" fill="url(#am-fold-l)"/>
  <!-- right fold: valley up to the right peak, wrapping over it -->
  <path d="M50 42.92 C53.51 46.47 55.67 49.28 59.6 48.56 L65.03 43.07 L67.99 50.51 L78.02 46.52 L73.49 35.1 A8 8 0 0 0 60.36 32.43 Z" fill="url(#am-fold-r)"/>
  <!-- right leg -->
  <g fill="url(#am-leg-r)">
    <path d="M65.03 43.07 C68.9 39.16 70.09 35.94 74.05 36.52 L83.62 60.61 L73.58 64.59 Z"/>
    <circle cx="78.6" cy="62.6" r="5.4"/>
  </g>
  <!-- the red "v" of the Antdv Next family -->
  <path d="M41.8 61.4 50 69.6l8.2-8.2" stroke="url(#am-heart)" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
